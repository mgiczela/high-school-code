<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--so basically, this whole thing is:
- apparently like phones origionaly process websites by jsut zooming out rlly far, kinda like some weird workaround from the olden days
- we dont want that. we want phone to like use its acutal width of hte screen in pixels (content="width-device-width")
- and we want no zooming (inditial-scale=1.0)
- and viewport is how we acess this data, its the viewable area on a screen. we are modifying it's size baiscally
- and meta is baiscally like head or style, it tells the computer how ot handle the info (not like an element onscreen)
-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    body {
      background-image: url('pictures/city.jpeg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    .centerNextQuestionButton {
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 250px;
    }

    .centerNextQuestionButton img {
      width: 250px;
    }

    .buttonContainer

    /*so basically, this is for if the code sees something tagged as buttonContainer then does this*/
      {
      display: grid;
      /*as it seems, the 4 elements inside shown in grid template*/
      grid-template-columns: 1fr 1fr;
      gap: 30px 60px;
      /* its gap: vertical horizontal*/
      max-width: 600px;
      /*max size we can get possible*/
      margin: 0 auto;
      /*0 is top margin, auto is left and right margins*/
    }

    .gameNameBanner {
      font-size: 30px;
    }

    .bannerText {
      font-size: 30px;
    }

    .buttonLabel {
      font-size: 20px;
      text-align: center;
    }

    .buttonLabel.longText {
      /*basically, if we added the longText class to the button's text (ie it was over 20 charachters), then make text smaller
    so it fits on the button*/
      font-size: 15px;
      text-align: center;
    }

    .flagImage {
      width: 300px;
      height: 200px;
    }

    .scoreboard h2 {
      font-size: 100%;
      margin-top: 0px;
      margin-bottom: 5px;
    }

    /*this is basically overiding the .buttonContainer function if screen is of certian size
ALSO NOTE: for sizes, just have em here and in the origional .whatever that is being overriden, otherwide they fight and 
its annoying and dont work os yea

also the aspect ratio is per asking ai for most common ratios of modern phones, add it cus modern phones have many pixels
but the ratio is still simmilar

ok new insight: right now i have px, or pixel units. I can use whats called vw, or viewport units, which is basically a percentage
of the total screen

i just had ai scale based on a sample screen i liked to be the same ratio,
so it works for any size as long as ratio is good
*/
    @media (max-aspect-ratio: 9/19) {
      .buttonContainer {
        grid-template-columns: 1fr;
        padding-left: .5vw;
        padding-right: .5vw;
        gap: 5vw 5vw;
        max-width: 80vw;
        /*width is 90% of screen*/
        margin: 0 auto;
        /*above margin 0, sides auto (same amt, center)*/
      }

      .bannerText {
        font-size: 4vw;
      }

      .flagImage {
        width: 61vw;
        height: 40vw;
      }

      .buttonLabel {
        font-size: 4.8vw;
      }

      .buttonLabel.longText {
        font-size: 3.6vw;
      }

      .scoreboard h2 {
        font-size: 4vw;
      }

      .centerNextQuestionButton {
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 60vw;

      }

      .centerNextQuestionButton img {
        width: 60vw;
      }




    }
  </style>
