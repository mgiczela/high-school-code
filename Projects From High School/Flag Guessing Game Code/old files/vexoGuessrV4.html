<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--so basically, this whole thing is:
- apparently like phones origionaly process websites by jsut zooming out rlly far, kinda like some weird workaround from the olden days
- we dont want that. we want phone to like use its acutal width of hte screen in pixels (content="width-device-width")
- and we want no zooming (inditial-scale=1.0)
- and viewport is how we acess this data, its the viewable area on a screen. we are modifying it's size baiscally
- and meta is baiscally like head or style, it tells the computer how ot handle the info (not like an element onscreen)
-->
